# Integración continua y publicación (spec 001: CA-10, CA-14, CA-15, CA-20; ADR-007 y ADR-012).
# verify repite lo que corre en local; deploy-production solo existe en main y depende de verify, así que un rojo
# impide publicar. La previsualización por propuesta de cambio llega en T12.
# Las acciones de terceros van fijadas por SHA de commit (cadena de suministro); el comentario dice su versión.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# En una propuesta, un empuje nuevo cancela la ejecución anterior; en main nunca se corta un despliegue a medias
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lee la versión de pnpm del campo packageManager de package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # La caché del almacén ya la lleva pnpm/action-setup
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Directo y no pnpm test:e2e, que volvería a construir
      - run: pnpm exec playwright test
      - run: pnpm perf:measure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouseci
          path: .lighthouseci/
          # Es una carpeta oculta: sin esto se sube vacía
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Para ejecutar el wrangler del lockfile, no uno cualquiera
      - run: pnpm install --frozen-lockfile
      # Se publica exactamente el dist/ que verificó verify, no uno reconstruido
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
